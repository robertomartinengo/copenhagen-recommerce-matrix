version: '3.8'

services:
  backend-api:
    build: .
    container_name: copenhagen_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  dashboard:
    build: .
    container_name: copenhagen_dashboard
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend-api:8000
    depends_on:
      - backend-api
    restart: always

  telegram-bot:
    build: .
    container_name: copenhagen_telegram_bot
    command: python bot.py
    env_file:
      - .env
    environment:
      - API_URL=http://backend-api:8000
    depends_on:
      - backend-api
    restart: always